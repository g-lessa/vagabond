<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="30" cy="30" r="28" stroke="url(#v-grad)" stroke-width="2.5" />
    <circle cx="30" cy="30" r="23" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3.5" stroke-opacity="0.45" />

    <!-- Cardinal Ticks -->
    <line x1="30" y1="2" x2="30" y2="7" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="53" x2="30" y2="58" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="2" y1="30" x2="7" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="53" y1="30" x2="58" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Globe Meridians -->
    <ellipse cx="30" cy="30" rx="13" ry="23" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="30" cy="30" rx="23" ry="9" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />

    <!-- Needles -->
    <polygon points="30,8 35,27 30,24" fill="#f59e0b" />
    <polygon points="30,8 25,27 30,24" fill="#fbbf24" opacity="0.85" />

    <polygon points="30,52 35,33 30,36" fill="#0284c7" />
    <polygon points="30,52 25,33 30,36" fill="#0369a1" opacity="0.85" />

    <polygon points="52,30 33,35 36,30" fill="#10b981" />
    <polygon points="52,30 33,25 36,30" fill="#34d399" opacity="0.85" />

    <polygon points="8,30 27,35 24,30" fill="#0ea5e9" />
    <polygon points="8,30 27,25 24,30" fill="#38bdf8" opacity="0.85" />

    <!-- Core Reticle -->
    <circle cx="30" cy="30" r="4.2" fill="#0f172a" stroke="url(#v-grad)" stroke-width="1.8" />
    <circle cx="30" cy="30" r="1.6" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <text x="82" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="2.5" fill="url(#text-grad)">VAGABOND</text>
  <text x="84" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="3.2" fill="#10b981">STREET EXPLORER</text>
</svg>
