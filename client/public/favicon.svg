<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vagabond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="vagabond-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Reticle Ticks -->
  <circle cx="32" cy="32" r="30" stroke="url(#vagabond-grad)" stroke-width="2.5" stroke-opacity="0.9" />
  <circle cx="32" cy="32" r="25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5" />

  <!-- Cardinal Tick Marks -->
  <line x1="32" y1="2" x2="32" y2="7" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="57" x2="32" y2="62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="2" y1="32" x2="7" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="57" y1="32" x2="62" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle Globe Meridian Ellipses -->
  <ellipse cx="32" cy="32" rx="14" ry="25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />
  <ellipse cx="32" cy="32" rx="25" ry="10" stroke="#10b981" stroke-width="1" stroke-opacity="0.35" />

  <!-- Dynamic Navigator Compass Star -->
  <!-- North Needle (Gold / Neon Cyan) -->
  <polygon points="32,9 37,29 32,26" fill="#f59e0b" />
  <polygon points="32,9 27,29 32,26" fill="#fbbf24" opacity="0.85" />

  <!-- South Needle (Dark Teal) -->
  <polygon points="32,55 37,35 32,38" fill="#0284c7" />
  <polygon points="32,55 27,35 32,38" fill="#0369a1" opacity="0.85" />

  <!-- East Needle (Emerald) -->
  <polygon points="55,32 35,37 38,32" fill="#10b981" />
  <polygon points="55,32 35,27 38,32" fill="#34d399" opacity="0.85" />

  <!-- West Needle (Cyan) -->
  <polygon points="9,32 29,37 26,32" fill="#0ea5e9" />
  <polygon points="9,32 29,27 26,32" fill="#38bdf8" opacity="0.85" />

  <!-- Central Core Radar Pulse -->
  <circle cx="32" cy="32" r="4.5" fill="#0f172a" stroke="url(#vagabond-grad)" stroke-width="2" />
  <circle cx="32" cy="32" r="1.8" fill="#f59e0b" />
</svg>
